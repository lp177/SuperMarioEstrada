<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Mario Estrada</title>
  <meta name="description" content="Super Mario Estrada — the greatest rescue that never happened. A satirical 2D platformer." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <style>
    /* Dark Material-inspired shell. The game itself owns everything inside the canvas. */
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --on-bg: #e0e0e0;
      --on-dim: #9e9e9e;
      --accent: #ffca28;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--on-bg);
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    #stage {
      /* 640x360 virtual canvas, scaled up to fill the viewport (16:9 fit). */
      image-rendering: pixelated;
      background: #000;
      outline: none;
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
    }
    footer {
      position: fixed;
      bottom: 4px;
      font-size: 11px;
      color: var(--on-dim);
      text-align: center;
      width: 100%;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-jszEjwlb.js"></script>
</head>
<body>
  <canvas id="stage" width="640" height="360" tabindex="0" aria-label="Super Mario Estrada game"></canvas>
  <footer>Parody &amp; political satire. Not affiliated with Nintendo. All art and sound generated in code.</footer>
</body>
</html>
